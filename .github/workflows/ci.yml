name: CI

# Guards the build and the PROTECTED gameplay behavior (handbook 7.6, 7.19).
# A failure here means either the build broke or tuned gameplay changed.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Characterization tests (protected behavior)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Warn if the committed build looks stale
        run: |
          # Soft check only. Live deploys build fresh — GitHub Pages via the
          # pages.yml workflow, Vercel via vercel.json buildCommand — so the
          # committed www/ is a convenience snapshot, not the deploy source.
          if ! git diff --quiet -- www; then
            echo "::warning::committed www/ differs from a fresh build (harmless; deploys rebuild). Run 'npm run build' to refresh it."
            git status --porcelain -- www || true
          fi
