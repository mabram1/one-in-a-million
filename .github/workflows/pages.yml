name: Deploy to GitHub Pages

# Builds the Vite app and publishes the COMPILED output (www/) to GitHub Pages.
# Pages must not serve the repo root — that is the un-built Vite source
# (index.html -> /src/main.ts), which has no CSS and no compiled JS.
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push cancel an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify (typecheck + protected-behavior tests)
        run: npm run verify
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
