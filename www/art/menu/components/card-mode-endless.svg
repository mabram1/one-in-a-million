    <rect x="7" y="7" width="226" height="246" rx="44" fill="url(#panel-fill)" stroke="#43e0cf" stroke-opacity=".72" stroke-width="5" filter="url(#shadow)"/>
    <ellipse cx="120" cy="74" rx="92" ry="66" fill="#43e0cf" fill-opacity=".12"/>
    <path d="M42 25h156" stroke="#ffffff" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>
